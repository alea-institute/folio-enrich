[project]
name = "folio-enrich"
version = "0.4.17"
description = "Legal document annotation pipeline using the FOLIO ontology"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic-settings>=2.7.0",
    "folio-python[search]>=0.1.5",
    "pyahocorasick>=2.0.0",
    "spacy>=3.7.0",
    "pypdf>=4.0.0",
    "python-docx>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "markdown-it-py>=3.0.0",
    "sse-starlette>=2.0.0",
    "pyarrow>=15.0.0; platform_system != 'Windows' or platform_machine != 'ARM64'",
    "rdflib>=7.0.0",
    "nupunkt>=0.1.0",
    "striprtf>=0.0.26",
    "olefile>=0.47",
    "httpx>=0.28.0",
    "faiss-cpu>=1.8",
    "openpyxl>=3.1.0",
    "eyecite>=2.7",
    "citeurl>=12.0",
    "psutil>=6.0.0",
    # Shared FOLIO source-text->concept matching engine (migration SCHEDULE.md row 2).
    # Resolved from PyPI (MIT, Damien's own).
    # EXACT pin, deliberately: this backend used to run an editable install onto the
    # ../../folio-resolve working tree, so its behavior silently tracked whatever branch was
    # checked out there. 0.3.1 carries the F4/F13 determinism corrections (folio-resolve
    # docs/migration/2026-08-05-v0.3.1-consumer-impact.md §4.2, §4.4), so the version must be a
    # reviewable edit here. 0.4.0 adds deterministic recall as an opt-in capability;
    # this consumer's default path remains unchanged. For local library dev, use a throwaway venv — do NOT
    # `uv pip install -e` into this one.
    "folio-resolve==0.4.0",
    # Shared Proposition ledger schema (Phase A U1; plan KTD4). EXACT tag pin, per the
    # folio-resolve precedent: annotations must be stored in a reviewable released schema,
    # never a drifting working tree. Switch to the PyPI pin (folio-propositions==0.1.0)
    # once the package is published there.
    "folio-propositions @ git+https://github.com/alea-institute/folio-propositions@v0.3.0",
]

[project.optional-dependencies]
# Local semantic embeddings (the default embedding_provider="local"). Pulls torch, so
# it's an opt-in extra: `pip install -e ".[embeddings]"` (or uv equivalent). Without it,
# local embeddings are unavailable and semantic FOLIO matching degrades gracefully.
embeddings = [
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "pytest-xdist>=3.5",
    "pytest-timeout>=2.3",
    "httpx>=0.28.0",
]

[tool.hatch.metadata]
# The folio-propositions dependency is a direct git-tag reference (see the pin
# comment above); hatchling rejects those unless explicitly allowed.
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 30
addopts = "-m 'not slow and not demo_regen and not eval' --strict-markers"
markers = [
    "slow: tests taking > 0.5s (pipeline, embedding, property loading)",
    "integration: tests using full ASGI stack",
    "demo_regen: demo freshness checks and auto-regeneration (run with -m demo_regen)",
    "eval: NER cross-validation gold-set eval; drives the pipeline (run with -m eval)",
]
